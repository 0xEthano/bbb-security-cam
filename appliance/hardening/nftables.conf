#!/usr/sbin/nft -f
# Default-drop firewall for the security camera appliance.
# Replace LAN_NET only if you intentionally want LAN SSH fallback; the
# hardened default does NOT expose SSH on the LAN.

flush ruleset

define WG_NET  = 10.10.10.0/24

table inet filter {
    chain input {
        type filter hook input priority 0;
        policy drop;

        iifname "lo" accept
        ct state established,related accept
        ct state invalid drop

        # WireGuard handshake. No other WAN service is opened.
        udp dport 51820 accept

        # SSH: only authenticated WireGuard peers.
        iifname "wg0" ip saddr $WG_NET tcp dport 22 accept

        # Live camera stream: only authenticated WireGuard peers.
        iifname "wg0" ip saddr $WG_NET tcp dport 8081 accept

        # Web control is configured localhost-only. This rule is a second
        # layer in case the Motion setting is changed later.
        iifname "lo" tcp dport 8080 accept

        # IPv4 diagnostics are limited to the WireGuard peers.
        iifname "wg0" icmp type echo-request accept
        # Essential ICMPv6 neighbour traffic is retained only for the host's
        # local IPv6 stack; router advertisements are intentionally NOT
        # accepted from the network.
        icmpv6 type { destination-unreachable, packet-too-big, time-exceeded, parameter-problem,
                     nd-neighbor-solicit, nd-neighbor-advert } accept

        # Silently count and drop anything not explicitly allowed above.
        # Avoid firewall log spam/journal writes on the small eMMC.
        counter drop
    }

    chain forward {
        type filter hook forward priority 0;
        policy drop;
    }

    chain output {
        type filter hook output priority 0;
        policy accept;
    }
}
