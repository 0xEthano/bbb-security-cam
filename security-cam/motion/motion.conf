############################################################
# BeagleBone Black security camera — motion.conf
# Debian 12 / Motion 4.5.x
# Camera: Microsoft LifeCam Cinema (045e:075d)
#
# Motion owns /dev/video0. The archival ring consumes Motion's local
# multipart-MJPEG stream so the camera is opened by only one process.
############################################################

# ---- System ----
# Under systemd, Motion must remain in the foreground.
daemon off
pid_file /run/motion/motion.pid
log_file /var/log/motion/motion.log
log_level 6

# ---- Capture ----
video_device /dev/video0
width 1280
height 720
framerate 15

# ---- Motion detection ----
# Starting values; tune these on the installed camera/mount.
threshold 1500
noise_level 32
noise_tune on
despeckle_filter EedDl
minimum_motion_frames 2
# This is deliberately modest: event hooks no longer control the
# six-minute post-event recording window.
event_gap 10
pre_capture 2
post_capture 2

# ---- Motion's own event pictures/movies: OFF ----
picture_output off
movie_output off
movie_passthrough off

target_dir /var/log/motion

# ---- Live stream ----
# Motion cannot bind stream_port to wg0 only, so nftables supplies the
# network access control. Only the WireGuard /32 peers can reach 8081.
stream_port 8081
stream_localhost off
stream_maxrate 15
stream_quality 60

# ---- Web control UI — localhost only ----
# Use an SSH local-forward when tuning remotely:
# ssh -L 8080:127.0.0.1:8080 debian@10.10.10.1
webcontrol_port 8080
webcontrol_localhost on
# 0 = read-only web control; temporarily set to 1 only while tuning.
webcontrol_parms 0

# ---- Event collector ----
# on_event_start starts/extends a detached collector that saves up to
# 6 minutes before the trigger (completed segments only) plus the next
# 12 *completed* 30-second segments after the trigger. on_event_end is
# informational only; the collector intentionally continues after Motion
# declares the event ended.
on_event_start /opt/security-cam/save-event.sh start %Y%m%d-%H%M%S
on_event_end /opt/security-cam/save-event.sh end

###end motion.conf
